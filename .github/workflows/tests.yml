name: tests

# Минуты Windows в приватных репозиториях считаются вдвойне, поэтому на каждый push —
# только Linux, а Windows — по тегам версий и вручную (SPEC 1.1, 14.10).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # сканер секретов проверяет всю историю
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1
      - name: Установка
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Проверки
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
          .venv/bin/python scripts/scan_secrets.py .
          .venv/bin/python scripts/check_docs.py .
          .venv/bin/python -m pytest -q

  windows:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Проверки
        run: |
          .venv\Scripts\ruff check .
          .venv\Scripts\ruff format --check .
          .venv\Scripts\pyright
          .venv\Scripts\python scripts\scan_secrets.py .
          .venv\Scripts\python scripts\check_docs.py .
          .venv\Scripts\python -m pytest -q
