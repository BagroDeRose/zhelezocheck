name: release

# ОТКЛЮЧЕНО (SPEC 1.1, 14.10): релизы собираются локально скриптом scripts/release.ps1.
# Оставлен только ручной запуск — на случай, если понадобится собрать релиз в облаке.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Тесты и проверки
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv\Scripts\ruff check .
          .venv\Scripts\ruff format --check .
          .venv\Scripts\pyright
          .venv\Scripts\python -m pytest -q
      - name: Сторонние программы (официальные релизы, проверка контрольных сумм)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\setup_vendor.ps1
      - name: Контрольные суммы не изменились
        shell: bash
        run: git diff --exit-code vendor/CHECKSUMS.txt
      - name: Сборка и самопроверка
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1
      - name: Архив и SHA-256
        shell: powershell
        run: |
          $name = "ZhelezoCheck-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path "dist\ЖелезоЧек" -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          Set-Content -Path "$name.sha256" -Value "$hash  $name" -Encoding ascii
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --draft \
            --title "ЖелезоЧек ${{ github.ref_name }}" \
            --notes-file docs/CHANGELOG.md \
            "$ZIP_NAME" "$ZIP_NAME.sha256"
