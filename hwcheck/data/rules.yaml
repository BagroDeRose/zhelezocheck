# Правила вердикта ЖелезоЧек.
#
# Здесь — тексты для покупателя, важность и вес каждого правила. Условия срабатывания
# описаны в hwcheck/verdict/rules.py (функция с тем же id), числовые пороги — в thresholds.json.
#
# severity: critical — «Уходить»; warning — повод торговаться; info — к сведению; ok — всё хорошо.
# weight: вклад предупреждения в решение «Торговаться» (см. negotiate_min_weight).
# В текстах можно подставлять значения в фигурных скобках — их передаёт условие правила.
# Специальные слова (вроде «троттлинг») пишутся только с пояснением в скобках — это проверяет тест.

negotiate_min_weight: 1.0

rules:
  # ---------------------------------------------------------------- Видеокарта
  gpu.fake:
    component: gpu
    severity: critical
    weight: 10
    title: "Видеокарта — не та, за которую её выдают"
    explanation: "{reasons} Такую карту перепрошили, чтобы продать дороже: её реальные возможности намного ниже заявленных."
    advice: "Не покупайте. Если продавец настаивает, что карта настоящая, — предложите проверить её в сервисе."

  gpu.vram_errors:
    component: gpu
    severity: critical
    weight: 10
    title: "Ошибки видеопамяти"
    explanation: "Тест видеопамяти нашёл {errors} ошибок. Исправная память не ошибается ни разу. Будут артефакты на экране, вылеты игр и драйвера."
    advice: "Не покупайте: ремонт видеопамяти (замена чипов) дорогой и не всегда помогает."

  gpu.emergency_stop:
    component: gpu
    severity: warning
    weight: 3
    title: "Видеокарта перегрелась до опасной температуры"
    explanation: "Под нагрузкой видеокарта нагрелась до {temp:.0f} °C, и программа остановила тест, чтобы не повредить её. Скорее всего, высохла термопаста, износились термопрокладки или забит радиатор."
    advice: "Без обслуживания системы охлаждения карту брать нельзя. Если всё же берёте — закладывайте чистку и замену термоинтерфейса."
    bargain: "Видеокарта перегревается до {temp:.0f} °C — нужна чистка и замена термопасты и термопрокладок (обычно 1,5–3 тыс. ₽ в сервисе)."

  gpu.overheat:
    component: gpu
    severity: warning
    weight: 2
    title: "Видеокарта сильно греется"
    explanation: "Под нагрузкой температура дошла до {temp:.0f} °C (у исправной карты с чистым радиатором обычно {typical:.0f} °C и ниже). Охлаждение не справляется."
    advice: "Спросите, когда карту чистили. Закладывайте обслуживание системы охлаждения."
    bargain: "Видеокарта греется до {temp:.0f} °C — потребуется чистка и замена термопасты."

  gpu.thermal_throttle:
    component: gpu
    severity: warning
    weight: 1.5
    title: "Видеокарта сбрасывает частоты от перегрева"
    explanation: "Под нагрузкой частота упала на {drop:.0f}% — сработал троттлинг (видеокарта сама замедляется, чтобы не перегреться). В играх это будет заметно как падение кадров."
    advice: "Проверьте, не забит ли радиатор пылью; закладывайте обслуживание охлаждения."
    bargain: "Видеокарта сбрасывает частоты под нагрузкой — нужна чистка и обслуживание охлаждения."

  gpu.fan_worn:
    component: gpu
    severity: warning
    weight: 1.5
    title: "Вентиляторы видеокарты работают на пределе"
    explanation: "Вентиляторы крутились на {fan:.0f}% при умеренной температуре {temp:.0f} °C. Так бывает при изношенных подшипниках, забитом радиаторе или прошивке после майнинга, где обороты зафиксированы на максимуме."
    advice: "Послушайте вентиляторы на слух: гул или треск — признак износа. Замена вентиляторов стоит 1–3 тыс. ₽."
    bargain: "Вентиляторы видеокарты постоянно на максимуме — вероятно, изношены (замена 1–3 тыс. ₽)."

  gpu.fan_not_spinning:
    component: gpu
    severity: warning
    weight: 2
    title: "Вентиляторы видеокарты не раскручиваются"
    explanation: "Температура выросла до {temp:.0f} °C, а вентиляторы не ускорились. Вентилятор может быть неисправен или отключён."
    advice: "Посмотрите на карту во время нагрузки: все ли вентиляторы крутятся. Неисправный вентилятор нужно менять."
    bargain: "Вентиляторы видеокарты не раскручиваются под нагрузкой — потребуется ремонт или замена."

  gpu.mining_bios:
    component: gpu
    severity: warning
    weight: 2
    title: "Похоже, у видеокарты майнинговая прошивка"
    explanation: "{details} Майнеры часто урезают лимиты, чтобы карта меньше потребляла. Такая карта работала круглосуточно, а в играх будет слабее, чем должна."
    advice: "Спросите про майнинг прямо. Прошивку можно вернуть на заводскую, но износ от круглосуточной работы останется."
    bargain: "Признаки майнинговой прошивки (урезанные лимиты) — карта, вероятно, работала круглосуточно."

  gpu.pcie_reduced:
    component: gpu
    severity: warning
    weight: 0.5
    title: "Видеокарта подключена по урезанной шине"
    explanation: "Сейчас задействовано линий шины PCIe (канал связи с материнской платой): {current} из {maximum} возможных. Возможно повреждение разъёма или контактов, либо карта стоит не в том слоте."
    advice: "Проверьте, в какой слот вставлена карта, и осмотрите её контакты: на них не должно быть потемнений и сколов."
    bargain: "Видеокарта работает на урезанной шине ({current} из {maximum} линий) — возможно, повреждены контакты."

  gpu.mining_popular:
    component: gpu
    severity: info
    weight: 0
    title: "Эту модель часто использовали для майнинга"
    explanation: "{model} была популярна у майнеров. Это не значит, что именно эта карта майнила, но стоит уточнить у продавца."
    advice: "Спросите, где и как использовалась карта, есть ли чек и коробка."

  gpu.unknown_model:
    component: gpu
    severity: info
    weight: 0
    title: "Модель видеокарты не удалось сверить со справочником"
    explanation: "{reasons}"
    advice: "Сверьте название и объём памяти вручную по фото коробки или наклейке на карте."

  gpu.ok:
    component: gpu
    severity: ok
    weight: 0
    title: "Видеокарта прошла проверку"
    explanation: "{model}: видеопамять без ошибок{temp_text}."
    advice: ""

  # ---------------------------------------------------------------- Процессор
  cpu.instability:
    component: cpu
    severity: critical
    weight: 10
    title: "Процессор ошибается в вычислениях"
    explanation: "Под нагрузкой процессор {mismatches} раз получил неверный результат. Компьютер будет зависать, выдавать синие экраны и портить файлы."
    advice: "Не покупайте, пока не найдена причина (перегрев, неудачный разгон, блок питания)."

  cpu.clock_drop:
    component: cpu
    severity: warning
    weight: 1.5
    title: "Процессор сбрасывает частоту под нагрузкой"
    explanation: "Частота упала с {start:.0f} до {end:.0f} МГц ({drop:.0f}%). Обычно это перегрев: высохла термопаста или кулер забит пылью, реже — слабое питание."
    advice: "Закладывайте чистку и замену термопасты; проверьте, что кулер крутится."
    bargain: "Процессор под нагрузкой теряет {drop:.0f}% частоты — нужна чистка кулера и замена термопасты."

  cpu.ok:
    component: cpu
    severity: ok
    weight: 0
    title: "Процессор прошёл проверку"
    explanation: "Под нагрузкой на всех ядрах ошибок вычислений нет, частота держится."
    advice: ""

  cpu.temp_zone:
    component: cpu
    severity: info
    weight: 0
    title: "Температура у процессора — по датчику материнской платы (примерно)"
    explanation: "Под нагрузкой датчик тепловой зоны рядом с процессором показал до {zone:.0f} °C. Это температура зоны материнской платы, а не самого процессора, поэтому — примерно. Главный признак перегрева — снижение частоты под нагрузкой — проверен отдельно."
    advice: ""

  cpu.temp_unmeasured:
    component: cpu
    severity: info
    weight: 0
    title: "Температура процессора проверена по частоте"
    explanation: "Температура процессора на этом компьютере напрямую не измеряется. Перегрев проверен по главному признаку — снижению частоты под нагрузкой. Если бы охлаждение не справлялось, частота бы упала."
    advice: ""

  # ---------------------------------------------------------------- Оперативная память
  ram.errors:
    component: memory
    severity: critical
    weight: 10
    title: "Ошибки оперативной памяти"
    explanation: "Быстрый тест нашёл {errors} ошибок в оперативной памяти. Будут зависания, синие экраны и испорченные файлы."
    advice: "Не покупайте как есть. Если планок несколько, неисправную можно найти, проверяя их по одной, — но это работа для продавца."

  ram.less_than_claimed:
    component: memory
    severity: warning
    weight: 2
    title: "Оперативной памяти меньше, чем заявлено"
    explanation: "Заявлено {claimed:g} ГБ, а установлено {actual:g} ГБ."
    advice: "Спросите продавца о разнице; цену нужно пересчитать."
    bargain: "Памяти {actual:g} ГБ вместо заявленных {claimed:g} ГБ."

  ram.mixed:
    component: memory
    severity: info
    weight: 0
    title: "Установлены разные планки памяти"
    explanation: "Планки отличаются производителем, моделью или частотой ({details}). Обычно это работает, но память может быть медленнее, а стабильность — хуже."
    advice: "Если планируете разгон памяти — лучше одинаковый комплект."

  ram.ok:
    component: memory
    severity: ok
    weight: 0
    title: "Оперативная память прошла быстрый тест"
    explanation: "Проверено {tested_gb:.1f} ГБ — ошибок нет. Это быстрый тест, он не заменяет многочасовой MemTest86."
    advice: ""

  # ---------------------------------------------------------------- Накопители
  disk.smart_failed:
    component: disk
    severity: critical
    weight: 10
    title: "Диск сам сообщает о неисправности"
    explanation: "Накопитель «{model}» по собственной самодиагностике считает себя неисправным. Он может отказать в любой момент."
    advice: "Не покупайте с этим диском или требуйте замену диска."

  disk.sectors_critical:
    component: disk
    severity: critical
    weight: 10
    title: "Диск активно разрушается"
    explanation: "У накопителя «{model}» {count} повреждённых или нестабильных участков (сектора, которые диск заменил запасными или не может прочитать). Диск умирает, данные под угрозой."
    advice: "Не покупайте с этим диском. Если компьютер нравится — только с заменой диска за счёт продавца."

  disk.sectors_warning:
    component: disk
    severity: warning
    weight: 1.5
    title: "На диске есть повреждённые участки"
    explanation: "У накопителя «{model}» {count} повреждённых или нестабильных участков. Исправный диск их не имеет; со временем их число обычно растёт."
    advice: "Не храните на этом диске важное, закладывайте замену."
    bargain: "Диск «{model}» имеет повреждённые участки ({count}) — скоро потребуется замена."

  disk.ssd_wear_critical:
    component: disk
    severity: critical
    weight: 10
    title: "Ресурс SSD исчерпан"
    explanation: "SSD «{model}» израсходовал {wear:.0f}% ресурса записи. Он может перейти в режим «только чтение» или отказать без предупреждения."
    advice: "Покупать только с заменой SSD."

  disk.ssd_wear_warning:
    component: disk
    severity: warning
    weight: 1.5
    title: "SSD сильно изношен"
    explanation: "SSD «{model}» израсходовал {wear:.0f}% ресурса записи. Скоро его придётся менять."
    advice: "Закладывайте покупку нового SSD."
    bargain: "SSD «{model}» изношен на {wear:.0f}% — скоро нужна замена."

  disk.crc:
    component: disk
    severity: warning
    weight: 0.5
    title: "Ошибки передачи данных к диску"
    explanation: "У накопителя «{model}» {count} ошибок передачи данных (обычно виноват кабель или разъём SATA, а не сам диск)."
    advice: "Замените кабель SATA — это копейки, но спросите продавца, не было ли зависаний."
    bargain: "Ошибки связи с диском «{model}» — нужно менять кабель, возможно, разъём."

  disk.read_errors:
    component: disk
    severity: critical
    weight: 10
    title: "Ошибки чтения системного диска"
    explanation: "При чтении системных файлов было {count} ошибок. Диск не может прочитать часть данных."
    advice: "Не покупайте с этим диском."

  disk.hdd_old:
    component: disk
    severity: info
    weight: 0
    title: "Жёсткий диск немолодой"
    explanation: "HDD «{model}» проработал {hours} часов (около {years:.1f} лет без выключения). Механика изнашивается — ресурс во многом выработан."
    advice: "Храните важные файлы в копии; планируйте замену на SSD."

  disk.ok:
    component: disk
    severity: ok
    weight: 0
    title: "Диск «{model}» в порядке"
    explanation: "Повреждённых участков нет{wear_text}."
    advice: ""

  # ---------------------------------------------------------------- Система
  system.whea:
    component: system
    severity: warning
    weight: 1
    title: "В журнале Windows есть аппаратные ошибки"
    explanation: "За {days} дней записано {count} аппаратных ошибок WHEA (сообщения процессора, памяти или шины о сбоях). Последняя — {last}."
    advice: "Спросите продавца о зависаниях и синих экранах. Если ошибок много — проблема в железе."
    bargain: "В журнале Windows {count} аппаратных ошибок за {days} дней."

  system.disk_events:
    component: system
    severity: warning
    weight: 1
    title: "Windows жаловалась на ошибки диска"
    explanation: "За {days} дней записано {count} ошибок дисков в журнале Windows. Последняя — {last}."
    advice: "Проверьте результаты по дискам ниже; спросите, не пропадали ли файлы."
    bargain: "В журнале Windows {count} ошибок дисков за {days} дней."

  system.disk_events_removable:
    component: system
    severity: info
    weight: 0
    title: "Ошибки съёмных накопителей в журнале Windows"
    explanation: "За {days} дней записано {count} ошибок флешек, карт памяти или уже отключённых дисков. На внутренние диски компьютера это не влияет — часто так бывает, если флешку выдернули без «безопасного извлечения»."
    advice: "На вердикт не влияет. Если ошибки относятся к флешке с этой программой — она в порядке, просто её отключали без извлечения."

  system.crashes:
    component: system
    severity: info
    weight: 0
    title: "Были синие экраны или внезапные выключения"
    explanation: "За {days} дней: синих экранов — {bsod}, выключений без завершения работы — {power}. Причиной может быть и железо, и программы, и просто выдернутая вилка."
    advice: "Спросите продавца, что происходило. Если повторяется часто — это повод насторожиться."

  # ---------------------------------------------------------------- Ноутбук
  battery.wear_bargain:
    component: battery
    severity: warning
    weight: 2
    title: "Батарея сильно изношена"
    explanation: "Батарея сохранила только {left:.0f}% исходной ёмкости (износ {wear:.0f}%, циклов заряда: {cycles}). При лёгкой работе ноутбук продержится примерно {hours:.1f} ч без зарядки."
    advice: "Закладывайте замену батареи."
    bargain: "Износ батареи {wear:.0f}% — понадобится замена (обычно 3–7 тыс. ₽)."

  battery.wear_warning:
    component: battery
    severity: warning
    weight: 1
    title: "Батарея заметно изношена"
    explanation: "Батарея потеряла {wear:.0f}% ёмкости (циклов заряда: {cycles}). При лёгкой работе — примерно {hours:.1f} ч без зарядки, заметно меньше, чем у нового."
    advice: "Если важна работа без розетки — учтите замену батареи в будущем."
    bargain: "Износ батареи {wear:.0f}% — время работы от батареи сократилось."

  battery.cycles_high:
    component: battery
    severity: info
    weight: 0
    title: "Батарея прошла много циклов заряда"
    explanation: "Циклов заряда: {cycles}. Обычно батарею рассчитывают на 300–1000 циклов, так что её ресурс заметно израсходован, даже если износ пока {wear:.0f}%."
    advice: "Учтите, что через год-два батарею, скорее всего, придётся менять."

  battery.ok:
    component: battery
    severity: ok
    weight: 0
    title: "Батарея в хорошем состоянии"
    explanation: "Износ батареи {wear:.0f}%, при лёгкой работе — примерно {hours:.1f} ч без зарядки."
    advice: ""
