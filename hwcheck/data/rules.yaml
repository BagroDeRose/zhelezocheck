# Правила вердикта ЖелезоЧек.
#
# Здесь — тексты для покупателя, важность и вес каждого правила. Условия срабатывания
# описаны в hwcheck/verdict/rules.py (функция с тем же id), числовые пороги — в thresholds.json.
#
# severity: critical — «Уходить»; warning — повод торговаться; info — к сведению; ok — всё хорошо.
# weight: вклад предупреждения в решение «Торговаться» (см. negotiate_min_weight).
# impact — влияние на покупку; limits — ограничение вывода и другие возможные причины;
# confidence — насколько правилу можно доверять (высокий по умолчанию; косвенные — средний
# или низкий). Это видно в оценке компонентов (SPEC_V2_1, этап 49).
# В текстах можно подставлять значения в фигурных скобках — их передаёт условие правила.
# Специальные слова (вроде «троттлинг») пишутся только с пояснением в скобках — это проверяет тест.

negotiate_min_weight: 1.0

rules:
  # ---------------------------------------------------------------- Видеокарта
  gpu.fake:
    component: gpu
    severity: critical
    weight: 10
    title: "Видеокарта — не та, за которую её выдают"
    explanation: "{reasons} Такую карту перепрошили, чтобы продать дороже: её реальные возможности намного ниже заявленных."
    advice: "Не покупайте. Если продавец настаивает, что карта настоящая, — предложите проверить её в сервисе."
    impact: "Карта стоит заметно меньше заявленной и слабее в играх."
    limits: "Сверка по коду устройства и справочнику; редкие сервисные модели могут отсутствовать в базе — тогда вывод «не удалось сверить», а не подделка."

  gpu.vram_errors:
    component: gpu
    severity: critical
    weight: 10
    title: "Ошибки видеопамяти"
    explanation: "Тест видеопамяти нашёл {errors} ошибок. Исправная память не ошибается ни разу. Будут артефакты на экране, вылеты игр и драйвера."
    advice: "Не покупайте: ремонт видеопамяти (замена чипов) дорогой и не всегда помогает."
    impact: "Видеокарта неисправна: артефакты, вылеты игр и драйвера."
    limits: "Ошибки нашёл тест памяти в этой проверке; изредка причиной бывает разгон памяти — его стоит сбросить и повторить тест."

  gpu.emergency_stop:
    component: gpu
    severity: warning
    weight: 3
    title: "Видеокарта перегрелась до опасной температуры"
    explanation: "Под нагрузкой видеокарта нагрелась до {temp:.0f} °C, и программа остановила тест, чтобы не повредить её. Возможные причины: пыль в радиаторе, высохшая термопаста или термопрокладки, неисправный вентилятор, плохой обдув корпуса."
    advice: "Без обслуживания системы охлаждения карту брать нельзя. Если всё же берёте — закладывайте чистку и замену термоинтерфейса."
    bargain: "Видеокарта перегревается до {temp:.0f} °C — нужна диагностика и обслуживание охлаждения (обычно 1,5–3 тыс. ₽ в сервисе)."
    impact: "Охлаждение видеокарты нужно обслуживать или чинить до использования."
    limits: "По одной температуре причину не определить: пыль в радиаторе, высохшая термопаста или прокладки, неисправный вентилятор, плохой обдув корпуса, разгон."

  gpu.overheat:
    component: gpu
    severity: warning
    weight: 2
    title: "Видеокарта сильно греется"
    explanation: "Под нагрузкой температура дошла до {temp:.0f} °C (у исправной карты с чистым радиатором обычно {typical:.0f} °C и ниже). Охлаждение не справляется."
    advice: "Спросите, когда карту чистили. Закладывайте обслуживание системы охлаждения."
    bargain: "Видеокарта греется до {temp:.0f} °C — вероятно, потребуется обслуживание охлаждения."
    impact: "Вероятны расходы на обслуживание охлаждения."
    limits: "Температура зависит от корпуса, комнаты и модели карты; причину (пыль, термоинтерфейс, вентиляторы) программа не определяет."

  gpu.thermal_throttle:
    component: gpu
    severity: warning
    weight: 1.5
    title: "Видеокарта сбрасывает частоты от перегрева"
    explanation: "Под нагрузкой частота упала на {drop:.0f}% — сработал троттлинг (видеокарта сама замедляется, чтобы не перегреться). В играх это будет заметно как падение кадров."
    advice: "Проверьте, не забит ли радиатор пылью; закладывайте обслуживание охлаждения."
    bargain: "Видеокарта сбрасывает частоты под нагрузкой — нужна чистка и обслуживание охлаждения."
    impact: "Производительность в играх ниже, чем могла бы быть."
    limits: "Снижение частоты фиксирует драйвер NVIDIA по своим причинам; источник перегрева программа не определяет."

  gpu.fan_worn:
    component: gpu
    severity: warning
    weight: 1.5
    title: "Вентиляторы видеокарты работают на пределе"
    explanation: "Вентиляторы крутились на {fan:.0f}% при умеренной температуре {temp:.0f} °C. Так бывает при изношенных подшипниках, забитом радиаторе или изменённой прошивке и настройках, где обороты зафиксированы на максимуме."
    advice: "Послушайте вентиляторы на слух: гул или треск — признак износа. Замена вентиляторов стоит 1–3 тыс. ₽."
    bargain: "Вентиляторы видеокарты постоянно на максимуме — вероятно, изношены (замена 1–3 тыс. ₽)."
    impact: "Возможна замена вентиляторов."
    limits: "Высокие обороты бывают и при забитом радиаторе, жаркой комнате или настройках/прошивке с фиксированными оборотами — износ подшипников это не доказывает."
    confidence: "средний"

  gpu.fan_not_spinning:
    component: gpu
    severity: warning
    weight: 2
    title: "Вентиляторы видеокарты не раскручиваются"
    explanation: "Температура выросла до {temp:.0f} °C, а вентиляторы не ускорились. Вентилятор может быть неисправен или отключён."
    advice: "Посмотрите на карту во время нагрузки: все ли вентиляторы крутятся. Неисправный вентилятор нужно менять."
    bargain: "Вентиляторы видеокарты не раскручиваются под нагрузкой — потребуется ремонт или замена."
    impact: "Без исправных вентиляторов карта перегреется — нужен ремонт."
    limits: "Датчик оборотов в процентах может не отражать отдельный вентилятор; посмотрите на карту под нагрузкой."

  gpu.mining_bios:
    component: gpu
    severity: warning
    weight: 2
    title: "Лимит мощности видеокарты ниже заводского"
    explanation: "{details} Лимит снижают настройками или прошивкой (в том числе после майнинга), бывает и заводская версия с другим лимитом. Сам по себе это не доказывает майнинг; в играх карта может быть слабее заявленной."
    advice: "Спросите, меняли ли прошивку и настройки. Заводскую прошивку обычно можно вернуть."
    bargain: "Лимит мощности видеокарты ниже заводского — производительность может быть ниже заявленной."
    impact: "Производительность может быть ниже заявленной для этой модели."
    limits: "Сниженный лимит не доказывает майнинг: его меняют настройками, прошивкой или производитель задаёт иначе для своей версии карты."
    confidence: "средний"

  gpu.pcie_reduced:
    component: gpu
    severity: warning
    weight: 0.5
    title: "Видеокарта подключена по урезанной шине"
    explanation: "Сейчас задействовано линий шины PCIe (канал связи с материнской платой): {current} из {maximum} возможных. Возможно повреждение разъёма или контактов, либо карта стоит не в том слоте."
    advice: "Проверьте, в какой слот вставлена карта, и осмотрите её контакты: на них не должно быть потемнений и сколов."
    bargain: "Видеокарта работает на урезанной шине ({current} из {maximum} линий) — возможно, повреждены контакты."
    impact: "Возможна потеря производительности и повреждение разъёма."
    limits: "Ширину шины снижают и райзер, и настройки платы, и слот с меньшим числом линий; повреждение контактов — лишь одна из причин."
    confidence: "средний"

  gpu.mining_popular:
    component: gpu
    severity: info
    weight: 0
    title: "Эту модель часто использовали для майнинга"
    explanation: "{model} была популярна у майнеров. Это не значит, что именно эта карта майнила, но стоит уточнить у продавца."
    advice: "Спросите, где и как использовалась карта, есть ли чек и коробка."
    impact: "Само по себе на цену не влияет — это повод задать вопросы."
    limits: "Популярность модели у майнеров ничего не говорит об этой карте."

  gpu.unknown_model:
    component: gpu
    severity: info
    weight: 0
    title: "Модель видеокарты не удалось сверить со справочником"
    explanation: "{reasons}"
    advice: "Сверьте название и объём памяти вручную по фото коробки или наклейке на карте."
    impact: "Подлинность модели не подтверждена — сверьте вручную."
    limits: "Справочник не охватывает все модели; отсутствие в нём не означает подделку."

  gpu.ok:
    component: gpu
    severity: ok
    weight: 0
    title: "Видеокарта прошла проверку"
    explanation: "{model}: видеопамять без ошибок{temp_text}."
    advice: ""

  # ---------------------------------------------------------------- Процессор
  cpu.instability:
    component: cpu
    severity: critical
    weight: 10
    title: "Процессор ошибается в вычислениях"
    explanation: "Под нагрузкой процессор {mismatches} раз получил неверный результат. Компьютер будет зависать, выдавать синие экраны и портить файлы."
    advice: "Не покупайте, пока не найдена причина (перегрев, неудачный разгон, блок питания)."
    impact: "Компьютер нестабилен: зависания, синие экраны, порча файлов."
    limits: "Причиной может быть разгон, перегрев, память или блок питания — по одной ошибке вычислений виновника не определить."

  cpu.clock_drop:
    component: cpu
    severity: warning
    weight: 1.5
    title: "Процессор сбрасывает частоту под нагрузкой"
    explanation: "Частота упала с {start:.0f} до {end:.0f} МГц ({drop:.0f}%). Так бывает при перегреве (пыль, термопаста, кулер), из-за лимитов мощности платы или настроек энергосбережения — по одному признаку причину не определить."
    advice: "Проверьте, что кулер крутится и радиатор чистый; спросите, когда компьютер обслуживали."
    bargain: "Процессор под нагрузкой теряет {drop:.0f}% частоты — возможно, нужно обслуживание охлаждения."
    impact: "Процессор работает медленнее, чем может."
    limits: "Частоту снижают и перегрев, и лимиты мощности платы, и настройки энергосбережения Windows; по одному признаку причину не определить."
    confidence: "средний"

  cpu.ok:
    component: cpu
    severity: ok
    weight: 0
    title: "Процессор прошёл проверку"
    explanation: "Под нагрузкой на всех ядрах ошибок вычислений нет, частота держится."
    advice: ""

  cpu.temp_zone:
    component: cpu
    severity: info
    weight: 0
    title: "Температура у процессора — по датчику материнской платы (примерно)"
    explanation: "Под нагрузкой датчик тепловой зоны рядом с процессором показал до {zone:.0f} °C. Это температура зоны материнской платы, а не самого процессора, поэтому — примерно. Частота под нагрузкой проверена отдельно."
    advice: ""
    impact: "Само по себе на покупку не влияет."
    limits: "Датчик тепловой зоны стоит на плате рядом с процессором, а не в нём; точность примерная, о температуре ядер он не говорит."

  cpu.temp_unmeasured:
    component: cpu
    severity: info
    weight: 0
    title: "Температура процессора не измерена"
    explanation: "Без драйвера уровня ядра Windows не сообщает температуру процессора, а программа драйверы не устанавливает. Поэтому о нагреве процессора программа ничего не утверждает; частота под нагрузкой проверена отдельно, но по ней температуру не определить."
    advice: ""
    impact: "Нагрев процессора не проверен — учитывайте это при решении."
    limits: "Без драйвера уровня ядра Windows температуру процессора не сообщает; по частоте её не определить."

  # ---------------------------------------------------------------- Оперативная память
  ram.errors:
    component: memory
    severity: critical
    weight: 10
    title: "Ошибки оперативной памяти"
    explanation: "Быстрый тест нашёл {errors} ошибок в оперативной памяти. Будут зависания, синие экраны и испорченные файлы."
    advice: "Не покупайте как есть. Если планок несколько, неисправную можно найти, проверяя их по одной, — но это работа для продавца."
    impact: "Память неисправна: зависания, синие экраны, порча файлов."
    limits: "Быстрый тест проверяет только свободную часть памяти; изредка ошибки даёт разгон (XMP) — его стоит отключить и повторить проверку."

  ram.less_than_claimed:
    component: memory
    severity: warning
    weight: 2
    title: "Оперативной памяти меньше, чем заявлено"
    explanation: "Заявлено {claimed:g} ГБ, а установлено {actual:g} ГБ."
    advice: "Спросите продавца о разнице; цену нужно пересчитать."
    bargain: "Памяти {actual:g} ГБ вместо заявленных {claimed:g} ГБ."
    impact: "Конфигурация не соответствует объявлению — цену нужно пересчитать."
    limits: "Windows показывает установленный объём; если планка не определилась, она может быть в слоте, но неисправна или плохо вставлена."

  ram.mixed:
    component: memory
    severity: info
    weight: 0
    title: "Установлены разные планки памяти"
    explanation: "Планки отличаются производителем, моделью или частотой ({details}). Это не неисправность: память просто работает на частоте и таймингах самой медленной планки."
    advice: "Если планируете разгон памяти — лучше одинаковый комплект."
    impact: "Обычно не влияет; для разгона памяти неудобно."
    limits: "Разные планки — не неисправность; память просто работает на частоте и таймингах самой медленной."

  ram.ok:
    component: memory
    severity: ok
    weight: 0
    title: "Оперативная память прошла быстрый тест"
    explanation: "Проверено {tested_gb:.1f} ГБ — ошибок нет. Это быстрый тест, он не заменяет многочасовой MemTest86."
    advice: ""

  # ---------------------------------------------------------------- Накопители
  disk.smart_failed:
    component: disk
    severity: critical
    weight: 10
    title: "Диск сам сообщает о неисправности"
    explanation: "Накопитель «{model}» по собственной самодиагностике считает себя неисправным. Он может отказать в любой момент."
    advice: "Не покупайте с этим диском или требуйте замену диска."
    impact: "Накопитель может отказать в любой момент — данные под угрозой."
    limits: "Это вывод самого накопителя по его самодиагностике; программа его только читает."

  disk.sectors_critical:
    component: disk
    severity: critical
    weight: 10
    title: "Диск активно разрушается"
    explanation: "У накопителя «{model}» {count} повреждённых или нестабильных участков (сектора, которые диск заменил запасными или не может прочитать). Диск умирает, данные под угрозой."
    advice: "Не покупайте с этим диском. Если компьютер нравится — только с заменой диска за счёт продавца."
    impact: "Накопитель нужно менять; данные под угрозой."
    limits: "Число повреждённых участков берётся из S.M.A.R.T.; скорость роста по одной проверке не определить."

  disk.sectors_warning:
    component: disk
    severity: warning
    weight: 1.5
    title: "На диске есть повреждённые участки"
    explanation: "У накопителя «{model}» {count} повреждённых или нестабильных участков. Исправный диск их не имеет; со временем их число обычно растёт."
    advice: "Не храните на этом диске важное, закладывайте замену."
    bargain: "Диск «{model}» имеет повреждённые участки ({count}) — скоро потребуется замена."
    impact: "Скоро может понадобиться замена накопителя."
    limits: "Несколько переназначенных секторов бывают и у старых дисков без дальнейшего роста; важна динамика, а её одна проверка не показывает."

  disk.ssd_wear_critical:
    component: disk
    severity: critical
    weight: 10
    title: "Ресурс SSD исчерпан"
    explanation: "SSD «{model}» израсходовал {wear:.0f}% ресурса записи. Он может перейти в режим «только чтение» или отказать без предупреждения."
    advice: "Покупать только с заменой SSD."
    impact: "SSD нужно менять."
    limits: "Ресурс оценивает сам накопитель; фактический отказ может наступить раньше или позже."

  disk.ssd_wear_warning:
    component: disk
    severity: warning
    weight: 1.5
    title: "SSD сильно изношен"
    explanation: "SSD «{model}» израсходовал {wear:.0f}% ресурса записи. Скоро его придётся менять."
    advice: "Закладывайте покупку нового SSD."
    bargain: "SSD «{model}» изношен на {wear:.0f}% — скоро нужна замена."
    impact: "Закладывайте замену SSD в ближайшее время."
    limits: "Ресурс оценивает сам накопитель по записанному объёму; это прогноз, а не измерение износа ячеек."

  disk.crc:
    component: disk
    severity: warning
    weight: 0.5
    title: "Ошибки передачи данных к диску"
    explanation: "У накопителя «{model}» {count} ошибок передачи данных (обычно виноват кабель или разъём SATA, а не сам диск)."
    advice: "Замените кабель SATA — это копейки, но спросите продавца, не было ли зависаний."
    bargain: "Ошибки связи с диском «{model}» — нужно менять кабель, возможно, разъём."
    impact: "Обычно расходы небольшие — кабель или разъём."
    limits: "Счётчик ошибок передачи не обнуляется: ошибки могли быть в прошлом (старый кабель) и уже не повторяться."

  disk.read_errors:
    component: disk
    severity: critical
    weight: 10
    title: "Ошибки чтения системного диска"
    explanation: "При чтении системных файлов было {count} ошибок. Диск не может прочитать часть данных."
    advice: "Не покупайте с этим диском."
    impact: "Накопитель не читает часть данных — нужна замена."
