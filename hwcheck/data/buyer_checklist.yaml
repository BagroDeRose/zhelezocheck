# Что покупателю проверить вручную перед оплатой (SPEC_V2_1, этап 47; MVP-спека, 3.1 п. 8).
#
# Каждый пункт показывается, если выполнено условие when:
#   always — всегда; laptop — проверяли ноутбук; discrete_gpu — есть отдельная видеокарта;
#   hdd — есть жёсткий диск; not_checked — часть проверок не прошла или не запускалась;
#   listing — проверка сверялась с объявлением.
# Это советы, а не находки: на вердикт они не влияют.

items:
  - when: always
    text: "Сверьте наклейки на корпусе и комплектующих с тем, что нашла программа (модель видеокарты, объём памяти, модель платы)."
  - when: discrete_gpu
    text: "Осмотрите видеокарту: нет следов разборки и пайки, вздутых конденсаторов, запаха гари; вентиляторы крутятся ровно и без треска."
  - when: always
    text: "Запустите знакомую игру или тяжёлую программу на 10–15 минут: компьютер не должен зависать, перезагружаться или сильно шуметь."
  - when: always
    text: "Проверьте все разъёмы, которыми будете пользоваться: USB, видеовыходы, звук, сеть, Wi-Fi."
  - when: hdd
    text: "Послушайте жёсткий диск: щелчки, скрежет и стук — плохой знак."
  - when: laptop
    text: "Проверьте экран (битые пиксели, засветы), клавиатуру, тачпад, веб-камеру, динамики и зарядку от комплектного блока."
  - when: not_checked
    text: "Часть проверок не прошла или не запускалась (список выше) — по возможности повторите их или проверьте эти места сами."
  - when: listing
    text: "Сверьте с объявлением то, что программа проверить не может: комплектацию, коробку, чек и гарантию."
  - when: always
    text: "Не переводите деньги заранее; договоритесь, что сможете вернуть покупку, если она окажется неисправной."
