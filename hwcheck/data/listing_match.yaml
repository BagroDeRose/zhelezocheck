# Сверка объявления с реальным железом (с 2.1: единственное, что осталось от раздела
# «Проверка объявления»; тревожные слова и цена по рынку убраны по решению владельца).
#
# Каждая запись — находка вердикта: важность (severity: ok / info / warning / critical),
# вес, заголовок и пояснение ({claimed}, {actual} и т. п. подставляются кодом), совет, влияние
# на покупку (impact), ограничение вывода (limits) и аргумент для торга (bargain).

match:
  gpu_match:
    severity: ok
    weight: 0
    title: "Видеокарта совпадает с объявлением"
    explanation: "Заявлена {claimed}, установлена именно она{vram_text}."
  gpu_vram_mismatch:
    severity: critical
    weight: 10
    title: "Заявлена {claimed} {claimed_vram:g} ГБ, обнаружена {claimed} {actual_vram:g} ГБ"
    explanation: "Это другая, более дешёвая версия карты: объём видеопамяти меньше, чем в объявлении."
    advice: "Не платите цену за версию с большим объёмом памяти. Покажите продавцу результат проверки."
    impact: "Конфигурация не соответствует объявлению — повод отказаться или пересчитать цену."
    limits: "Сверка по объёму памяти, который сообщает драйвер; редкие версии карт могут отличаться."
  gpu_mismatch:
    severity: critical
    weight: 10
    title: "Заявлена {claimed}, обнаружена {actual}"
    explanation: "В компьютере стоит не та видеокарта, что указана в объявлении. Модель определена по коду устройства, который нельзя подделать наклейкой или прошивкой."
    advice: "Не покупайте: вам продают не то, что обещали."
    impact: "Не та видеокарта, что в объявлении, — повод отказаться или пересчитать цену."
    limits: "Название из объявления распознаётся автоматически; проверьте текст объявления сами."
  cpu_match:
    severity: ok
    weight: 0
    title: "Процессор совпадает с объявлением"
    explanation: "Заявлен {claimed}, установлен именно он."
  cpu_mismatch:
    severity: warning
    weight: 2
    title: "Заявлен процессор {claimed}, обнаружен {actual}"
    explanation: "Процессор отличается от указанного в объявлении."
    advice: "Уточните у продавца и пересчитайте цену под реальный процессор."
    bargain: "В объявлении процессор {claimed}, а установлен {actual}."
    impact: "Не тот процессор, что в объявлении, — цену нужно пересчитать."
    limits: "Название из объявления распознаётся автоматически; проверьте текст объявления сами."
