# Тексты находок ручных проверок ноутбука (экран, клавиатура).
screen_defects:
  severity: critical
  weight: 10
  title: "На экране есть битые пиксели или полосы"
  explanation: "Вы отметили дефекты экрана во время теста. Битые пиксели и полосы со временем обычно не исчезают, а полосы часто говорят о повреждении матрицы или шлейфа."
  advice: "Замена матрицы ноутбука стоит дорого (часто 5–15 тыс. ₽). Покупайте только с большой скидкой, если дефект вас не смущает."
screen_ok:
  severity: ok
  weight: 0
  title: "Экран без видимых дефектов"
  explanation: "На всех цветах тестового экрана вы не заметили битых пикселей и полос."
keyboard_missing:
  severity: warning
  weight: 1.5
  title: "Не все клавиши откликнулись"
  explanation: "Во время теста не нажимались: {keys}. Если вы нажимали их, а подсветки не было — эти клавиши не работают."
  advice: "Нажмите эти клавиши ещё раз. Неработающая клавиша — повод для торга или замены клавиатуры (обычно 1,5–4 тыс. ₽)."
  bargain: "Не работают клавиши: {keys} — потребуется ремонт или замена клавиатуры."
keyboard_ok:
  severity: ok
  weight: 0
  title: "Все клавиши работают"
  explanation: "Каждая клавиша на схеме откликнулась на нажатие."
