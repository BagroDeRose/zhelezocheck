# Тревожные признаки в объявлении о продаже.
#
# patterns — регулярные выражения (без учёта регистра), ищутся в заголовке, описании и
# характеристиках. Если рядом с совпадением стоит отрицание («не», «без», «нет», «никогда»),
# признак не срабатывает, а вместо него появляется пометка denied («продавец утверждает…»).
# Числовые признаки (цена, возраст аккаунта, число объявлений) считаются в коде,
# их пороги — в разделе limits.

limits:
  price_low_ratio: 0.65        # цена ниже 65% медианы похожих объявлений
  new_seller_months: 3         # аккаунту меньше 3 месяцев
  many_listings: 10            # у продавца 10 и больше объявлений

flags:
  mining:
    severity: warning
    weight: 1
    patterns: ['майн\w*', '\bферм(?:а|ы|е|у|ой)\b', '\bриг(?:а|е|и|ов)?\b', 'mining', '\bmined\b']
    title: "В объявлении упоминается майнинг"
    explanation: "Похоже, карта работала на майнинговой ферме — круглосуточно, часто с перегретой памятью и изношенными вентиляторами."
    advice: "Особенно внимательно смотрите на тест видеопамяти и вентиляторы; спросите, сколько месяцев карта майнила."
    bargain: "Карта работала в майнинге — это износ, цена должна быть ниже обычной."
    denied:
      title: "Продавец пишет, что майнинга не было"
      explanation: "Это слова продавца — проверить их напрямую нельзя. Признаки майнинга (урезанная прошивка, изношенные вентиляторы) покажут тесты."

  no_bargain:
    severity: info
    weight: 0
    patterns: ['без\s+торга', 'торг\s+не\s+уместен', 'торга\s+нет']
    title: "Продавец пишет «без торга»"
    explanation: "Это не признак обмана, но если проверка найдёт недостатки — у вас будут веские аргументы всё равно попросить скидку."
    advice: "Покажите продавцу результаты проверки, если они есть."

  prepay_only:
    severity: warning
    weight: 2
    patterns: ['только\s+(?:доставк\w*|отправк\w*)', '(?:только|полная)\s+предоплат\w*', 'предоплат\w*\s+на\s+карту', 'встреч\w*\s+не\s+(?:будет|получится)']
    title: "Только доставка или предоплата"
    explanation: "Продавец не хочет встречаться и просит деньги заранее — так чаще всего работают мошенники. Проверить железо до оплаты будет невозможно."
    advice: "Не переводите деньги заранее. Покупайте только при личной встрече с проверкой или через безопасную сделку площадки."
    bargain: "Продавец предлагает только доставку/предоплату — без проверки до оплаты."

  not_tested:
    severity: warning
    weight: 1.5
    patterns: ['не\s+тестировал\w*', 'не\s+проверял\w*', 'без\s+проверки', 'нет\s+возможности\s+(?:проверить|проверки|подключить)', 'проверить\s+(?:не\s+на\s+чем|негде)']
    title: "Продавец не проверял железо или не даёт проверить"
    explanation: "Если продавец сам не знает, работает ли вещь, или не даёт её проверить — велик риск купить неисправное."
    advice: "Настаивайте на проверке перед покупкой. Без неё — только с правом возврата."
    bargain: "Железо продаётся без проверки — риск неисправности на покупателе."

  repaired:
    severity: warning
    weight: 2
    patterns: ['после\s+ремонт\w*', 'перепа\w*', 'прогре(?:в|т)\w*', 'реболл\w*', 'менял\w*\s+(?:чип|памят\w*|видеочип)', 'восстановлен\w*']
    title: "Железо было в ремонте"
    explanation: "Упоминается ремонт, перепайка или прогрев. Прогрев чипа часто помогает лишь на время — неисправность может вернуться через несколько недель."
    advice: "Спросите, что именно чинили и есть ли гарантия сервиса. Особенно внимательно отнеситесь к тестам под нагрузкой."
    bargain: "Железо было в ремонте (перепайка/прогрев) — неисправность может вернуться."

  for_parts:
    severity: warning
    weight: 3
    patterns: ['на\s+запчаст\w*', 'не\s+запускает\w*', 'не\s+работает', 'под\s+ремонт', 'нет\s+изображени\w*', 'артефакт\w*\s+(?:есть|бывают|появля\w*)']
    title: "Продаётся как неисправное"
    explanation: "В объявлении сказано, что вещь не работает или продаётся на запчасти. Рассчитывать на рабочее железо нельзя."
    advice: "Покупайте только если вам нужны именно запчасти или вы готовы к ремонту."
    bargain: "Продавец сам указывает на неисправность — это цена запчастей, а не рабочего железа."

  # Числовые признаки — тексты для них:
  price_low:
    severity: warning
    weight: 1.5
    title: "Цена подозрительно низкая"
    explanation: "Цена {price} ₽ — это {percent:.0f}% от средней цены похожих объявлений ({median} ₽). Так дёшево продают неисправное, краденое или это приманка мошенников."
    advice: "Спросите, почему так дёшево; обязательно проверяйте железо до оплаты."

  new_seller:
    severity: warning
    weight: 1
    title: "Новый аккаунт продавца"
    explanation: "Продавец зарегистрировался недавно ({since}). Мошенники часто создают новые аккаунты под каждое объявление."
    advice: "Встречайтесь лично, деньги — только после проверки."

  many_same:
    severity: info
    weight: 0
    title: "У продавца много объявлений или несколько одинаковых карт"
    explanation: "{details} Так бывает у перекупщиков и при распродаже бывших майнинговых ферм."
    advice: "Уточните происхождение железа; проверяйте именно ту единицу, которую покупаете."

# Сверка заявленного в объявлении с тем, что нашла программа (listing/match.py).
match:
  gpu_match:
    severity: ok
    weight: 0
    title: "Видеокарта совпадает с объявлением"
    explanation: "Заявлена {claimed}, установлена именно она{vram_text}."
  gpu_vram_mismatch:
    severity: critical
    weight: 10
    title: "Заявлена {claimed} {claimed_vram:g} ГБ, обнаружена {claimed} {actual_vram:g} ГБ"
    explanation: "Это другая, более дешёвая версия карты: объём видеопамяти меньше, чем в объявлении."
    advice: "Не платите цену за версию с большим объёмом памяти. Покажите продавцу результат проверки."
  gpu_mismatch:
    severity: critical
    weight: 10
    title: "Заявлена {claimed}, обнаружена {actual}"
    explanation: "В компьютере стоит не та видеокарта, что указана в объявлении. Модель определена по коду устройства, который нельзя подделать наклейкой или прошивкой."
    advice: "Не покупайте: вам продают не то, что обещали."
  cpu_match:
    severity: ok
    weight: 0
    title: "Процессор совпадает с объявлением"
    explanation: "Заявлен {claimed}, установлен именно он."
  cpu_mismatch:
    severity: warning
    weight: 2
    title: "Заявлен процессор {claimed}, обнаружен {actual}"
    explanation: "Процессор отличается от указанного в объявлении."
    advice: "Уточните у продавца и пересчитайте цену под реальный процессор."
    bargain: "В объявлении процессор {claimed}, а установлен {actual}."
